<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏪 KASIR LMJ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; padding: 10px; max-width: 520px; margin: 0 auto; padding-bottom: 30px; }
        
        .login-box { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0f766e, #14b8a6); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .login-card { background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-card h2 { text-align: center; color: #0f766e; margin-bottom: 25px; font-size: 28px; }
        .login-card input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 10px; margin-bottom: 15px; outline: none; }
        .login-card input:focus { border-color: #0f766e; }
        .btn-login { width: 100%; padding: 14px; background: #0f766e; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; }
        .btn-login:active { background: #0d9488; }
        .peran { display: flex; gap: 10px; margin-bottom: 15px; }
        .peran label { flex:1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 600; }
        .peran input { display: none; }
        .peran input:checked + label { border-color: #0f766e; background: #ccfbf1; color: #0f766e; }
        
        .header { background: linear-gradient(135deg, #0f766e, #14b8a6); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .user-info { font-size: 13px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-logout { background: #f43f5e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab { flex:1; min-width: 80px; padding: 10px; border: none; border-radius: 8px; background: #e2e8f0; cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab.aktif { background: #0f766e; color: white; }
        .konten-tab { display: none; }
        .konten-tab.aktif { display: block; }
        
        .produk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .produk { background: white; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .produk:active { transform: scale(0.96); background: #ccfbf1; }
        .produk-nama { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
        .produk-harga { color: #0f766e; font-size: 12px; font-weight: 600; }
        .produk-stok { font-size: 10px; color: #888; margin-top: 2px; }
        
        .keranjang { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .keranjang h3 { margin-bottom: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .item button { width: 30px; height: 30px; border: none; border-radius: 50%; background: #ef4444; color: white; cursor: pointer; font-weight: bold; }
        
        .total-box { background: linear-gradient(135deg, #fef3c7, #fde68a); padding: 15px; border-radius: 10px; margin: 12px 0; }
        .total-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
        .total-besar { font-size: 24px; font-weight: 900; color: #92400e; margin-top: 5px; }
        
        .bayar-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #e2e8f0; border-radius: 8px; margin: 8px 0; outline: none; }
        input:focus { border-color: #0f766e; }
        .kembalian-box { font-size: 20px; margin-top: 12px; padding: 10px; background: #dcfce7; border-radius: 8px; text-align: center; }
        .kembalian-box strong { color: #166534; }
        
        .btn { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 8px; }
        .btn-bayar { background: linear-gradient(135deg, #16a34a, #15803d); color: white; }
        .btn-reset { background: #f43f5e; color: white; }
        
        .admin-only { display: none; }
        body.admin .admin-only { display: block; }
        
        .nota-wrapper { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; padding: 20px; overflow-y: auto; }
        .nota-wrapper.aktif { display: flex; align-items: center; justify-content: center; }
        .nota { background: white; width: 80mm; padding: 20px; font-family: 'Courier New', monospace; }
        .nota-hr { border: none; border-top: 1px dashed #333; margin: 8px 0; }
        .nota-row { display: flex; justify-content: space-between; padding: 2px 0; }
        .nota-total { font-weight: 900; font-size: 15px; border-top: 1px dashed #333; border-bottom: 1px dashed #333; padding: 6px 0; margin: 5px 0; }
    </style>
</head>
<body>

<!-- LAYER LOGIN -->
<div class="login-box" id="loginLayer">
    <div class="login-card">
        <h2>🏪 KASIR LMJ</h2>
        <div class="peran">
            <input type="radio" name="peran" id="peranAdmin" value="admin" checked>
            <label for="peranAdmin">👑 Admin</label>
            <input type="radio" name="peran" id="peranKasir" value="kasir">
            <label for="peranKasir">🧑‍💼 Kasir</label>
        </div>
        <input type="text" id="userNama" placeholder="Nama Pengguna">
        <input type="password" id="userPass" placeholder="Kata Sandi">
        <button class="btn-login" onclick="loginMasuk()">🔑 Masuk</button>
        <p style="text-align:center; margin-top:15px; font-size:12px; color:#666;">
            Admin: nama=<b>admin</b> sandi=<b>123456</b><br>
            Kasir: nama=<b>kasir</b> sandi=<b>123456</b>
        </p>
    </div>
</div>

<!-- APLIKASI UTAMA -->
<div id="aplikasiUtama" style="display:none;">
    <div class="header">
        <h2>KASIR LMJ</h2>
        <p id="tanggal"></p>
        <div class="user-info">
            <span id="namaUser"></span>
            <button class="btn-logout" onclick="keluarAkun()">🚪 Keluar</button>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab aktif" onclick="bukaTab('kasir')">🛒 Kasir</button>
        <button class="tab" onclick="bukaTab('riwayat')">📋 Riwayat</button>
    </div>

    <div class="konten-tab aktif" id="tab-kasir">
        <div class="produk-grid" id="produkGrid"></div>
        
        <div class="keranjang">
            <h3>🛒 Keranjang</h3>
            <div id="daftarKeranjang"><p style="color:#888; text-align:center;">Pilih barang</p></div>
            <div class="total-box">
                <div class="total-row"><span>Total:</span><span id="totalAkhir">Rp 0</span></div>
            </div>
        </div>
        
        <div class="bayar-box">
            <label>Uang Diterima:</label>
            <input type="number" id="uangBayar" placeholder="0" oninput="hitungKembalian()">
            <div class="kembalian-box">Kembalian: <strong id="kembalian">Rp 0</strong></div>
            <button class="btn btn-bayar" onclick="prosesBayar()">✅ Selesai</button>
            <button class="btn btn-reset" onclick="resetKeranjang()">🗑️ Kosongkan</button>
        </div>
    </div>

    <div class="konten-tab" id="tab-riwayat">
        <h3 style="margin-bottom:15px;">📋 Riwayat</h3>
        <div id="daftarRiwayat"></div>
    </div>
</div>

<script>
// DATA PENGGUNA — PASTIKAN PERSIS SEPERTI INI!
const DEFAULT_USERS = {
    admin: { nama: 'admin', sandi: '123456', peran: 'admin' },
    kasir: { nama: 'kasir', sandi: '123456', peran: 'kasir' }
};

const DEFAULT_PRODUK = [
    { id:1, nama:'Kopi Sachet', harga:2500, stok:50 },
    { id:2, nama:'Air Mineral', harga:3000, stok:100 },
    { id:3, nama:'Roti Manis', harga:5000, stok:30 },
    { id:4, nama:'Gula 1kg', harga:15000, stok:25 },
    { id:5, nama:'Mie Instan', harga:3500, stok:200 }
];

let penggunaSaatIni = null;
let keranjang = [], riwayat = [], noTransaksi = 1;
let produkStok = [];

// FUNGSI LOGIN — SANGAT SEDERHANA
function loginMasuk() {
    const peran = document.querySelector('input[name="peran"]:checked').value;
    const nama = document.getElementById('userNama').value.trim().toLowerCase();
    const sandi = document.getElementById('userPass').value;
    
    console.log('Cek masuk — Nama:', nama, 'Sandi:', sandi, 'Peran:', peran);
    
    if (!nama) return alert('⚠️ Isi nama pengguna!');
    if (!sandi) return alert('⚠️ Isi kata sandi!');
    
    const user = DEFAULT_USERS[nama];
    if (!user) {
        alert('❌ Pengguna tidak dikenal! Gunakan: admin atau kasir');
        return;
    }
    if (user.sandi !== sandi) {
        alert('❌ Kata sandi salah! Harus: 123456');
        return;
    }
    if (user.peran !== peran) {
        alert('⚠️ Pilih peran yang benar di atas!');
        return;
    }
    
    penggunaSaatIni = user;
    document.getElementById('loginLayer').style.display = 'none';
    document.getElementById('aplikasiUtama').style.display = 'block';
    document.getElementById('namaUser').textContent = user.nama;
    if(user.peran === 'admin') document.body.classList.add('admin');
    
    inisialisasi();
}

function keluarAkun() {
    if(!confirm('Yakin keluar?')) return;
    location.reload();
}

function inisialisasi() {
    produkStok = JSON.parse(localStorage.getItem('stokLMJ') || JSON.stringify(DEFAULT_PRODUK));
    riwayat = JSON.parse(localStorage.getItem('riwayatLMJ') || '[]');
    noTransaksi = parseInt(localStorage.getItem('noTrxLMJ') || '1');
    document.getElementById('tanggal').textContent = new Date().toLocaleString('id-ID');
    tampilProduk();
}

function bukaTab(nama) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('aktif'));
    document.querySelectorAll('.konten-tab').forEach(k => k.classList.remove('aktif'));
    event.target.classList.add('aktif');
    document.getElementById(`tab-${nama}`).classList.add('aktif');
    if(nama === 'riwayat') tampilRiwayat();
}

function tampilProduk() {
    const el = document.getElementById('produkGrid');
    el.innerHTML = '';
    produkStok.forEach(p => {
        el.innerHTML += `
            <div class="produk" onclick="tambah(${p.id})">
                <div class="produk-nama">${p.nama}</div>
                <div class="produk-harga">Rp ${p.harga.toLocaleString('id-ID')}</div>
                <div class="produk-stok">Stok: ${p.stok}</div>
            </div>
        `;
    });
}

function tambah(id) {
    const p = produkStok.find(x => x.id === id);
    const ada = keranjang.find(x => x.id === id);
    if(ada) ada.qty++;
    else keranjang.push({...p, qty:1});
    updateKeranjang();
}

function ubahQty(idx, delta) {
    keranjang[idx].qty += delta;
    if(keranjang[idx].qty <= 0) keranjang.splice(idx, 1);
    updateKeranjang();
}

function updateKeranjang() {
    const el = document.getElementById('daftarKeranjang');
    if(keranjang.length === 0) {
        el.innerHTML = '<p style="color:#888; text-align:center;">Pilih barang</p>';
    } else {
        el.innerHTML = '';
        keranjang.forEach((item, i) => {
            el.innerHTML += `
                <div class="item">
                    <span>${item.nama}</span>
                    <span style="display:flex; gap:8px; align-items:center;">
                        <button onclick="ubahQty(${i}, -1)">−</button>
                        ${item.qty}
                        <button onclick="ubahQty(${i}, 1)">+</button>
                    </span>
                    <span>Rp ${(item.harga*item.qty).toLocaleString('id-ID')}</span>
                </div>
            `;
        });
    }
    hitungTotal();
}

function hitungTotal() {
    const total = keranjang.reduce((s, i) => s + i.harga*i.qty, 0);
    document.getElementById('totalAkhir').textContent = `Rp ${total.toLocaleString('id-ID')}`;
    hitungKembalian();
}

function hitungKembalian() {
    const total = keranjang.reduce((s, i) => s + i.harga*i.qty, 0);
    const bayar = parseInt(document.getElementById('uangBayar').value) || 0;
    document.getElementById('kembalian').textContent = `Rp ${(bayar - total).toLocaleString('id-ID')}`;
}

function prosesBayar() {
    const total = keranjang.reduce((s, i) => s + i.harga*i.qty, 0);
    const bayar = parseInt(document.getElementById('uangBayar').value) || 0;
    if(keranjang.length === 0) return alert('⚠️ Keranjang kosong!');
    if(bayar < total) return alert(`⚠️ Kurang Rp ${(total - bayar).toLocaleString('id-ID')}`);
    
    keranjang.forEach(item => {
        const p = produkStok.find(x => x.id === item.id);
        if(p) p.stok -= item.qty;
    });
    localStorage.setItem('stokLMJ', JSON.stringify(produkStok));
    
    riwayat.unshift({
        no: `TRX-${noTransaksi++}`,
        tanggal: new Date().toLocaleString('id-ID'),
        total, bayar, kembali: bayar - total,
        items: [...keranjang]
    });
    localStorage.setItem('riwayatLMJ', JSON.stringify(riwayat));
    localStorage.setItem('noTrxLMJ', noTransaksi);
    
    alert('✅ Transaksi Berhasil!');
    resetKeranjang();
    tampilProduk();
}

function resetKeranjang() {
    keranjang = [];
    document.getElementById('uangBayar').value = '';
    updateKeranjang();
}

function tampilRiwayat() {
    const el = document.getElementById('daftarRiwayat');
    if(riwayat.length === 0) { el.innerHTML = '<p style="text-align:center; color:#888;">Belum ada transaksi</p>'; return; }
    el.innerHTML = '';
    riwayat.forEach(r => {
        el.innerHTML += `
            <div style="background:white; padding:12px; border-radius:10px; margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; font-weight:bold;">
                    <span>${r.no}</span>
                    <span>Rp ${r.total.toLocaleString('id-ID')}</span>
                </div>
                <div style="font-size:12px; color:#666; margin-top:5px;">${r.tanggal}</div>
            </div>
        `;
    });
}
</script>
</body>
</html>
